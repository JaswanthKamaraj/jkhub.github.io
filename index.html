<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JK | Jaswanth Kamaraj J</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 60px 20px;
            text-align: center;
        }

        /* Profile Picture */
        .profile {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            margin-bottom: 25px;
        }

        /* Name */
        h1 {
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        /* Username */
        .username {
            color: #999;
            font-size: 17px;
            margin-bottom: 20px;
        }

        /* Bio */
        .bio {
            color: #ccc;
            font-size: 17px;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        /* Buttons */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button {
            display: block;
            padding: 16px;
            border: 1px solid #333;
            border-radius: 30px;
            background: #111;
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .button:hover {
            background: white;
            color: black;
            transform: scale(1.03);
        }

        /* Footer */
        footer {
            margin-top: 50px;
            color: #666;
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 500px) {
            h1 {
                font-size: 25px;
            }

            .profile {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- PROFILE PHOTO -->
        <img
            class="profile"
            src="profile.jpg"
            alt="Jaswanth Kamaraj J"
        >

        <!-- NAME -->
        <h1>JASWANTH KAMARAJ J</h1>

        <!-- INSTAGRAM USERNAME -->
        <div class="username">
            @jaswanth._.07_
        </div>

        <!-- BIO -->
        <p class="bio">
            EDITOR AND PHOTOGRAPHY 📸
        </p>

        <!-- SOCIAL LINKS -->
        <div class="buttons">

            <!-- Instagram -->
            <a
                class="button"
                href="https://www.instagram.com/jaswanth._.07_/"
                target="_blank"
                rel="noopener noreferrer">
                📸 Instagram
            </a>

            <!-- GitHub -->
            <a
                class="button"
                href="https://github.com/jkhub"
                target="_blank"
                rel="noopener noreferrer">
                💻 GitHub
            </a>

            <!-- Email -->
            <a
                class="button"
                href="mailto:rockjaswanth.157@gmail.com">
                ✉️ Contact Me
            </a>

        </div>

        <!-- FOOTER -->
        <footer>
            © 2026 JK • Jaswanth Kamaraj J
        </footer>

    </div>

</body>
</html>
