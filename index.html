<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JASWANTH KAMARAJ J | JK</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 50% 15%, #07345a 0%, #031426 30%, #020812 65%, #010308 100%);
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 55px 25px 40px;
        }

        /* Top Text */
        .tagline {
            color: #00bfff;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 8px;
            line-height: 2;
            margin-bottom: 28px;
            text-transform: uppercase;
            text-shadow: 0 0 15px #00bfff;
        }

        /* Profile Image */
        .profile-box {
            width: 300px;
            height: 300px;
            margin: auto;
            padding: 5px;
            border: 3px solid #00bfff;
            border-radius: 35px;
            box-shadow:
                0 0 15px #00bfff,
                0 0 45px rgba(0, 191, 255, 0.35);
            overflow: hidden;
        }

        .profile {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
            display: block;
        }

        /* Name */
        h1 {
            margin-top: 45px;
            font-size: 43px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Username */
        .username {
            margin-top: 18px;
            color: #c5d2df;
            font-size: 18px;
            letter-spacing: 2px;
        }

        /* Bio */
        .bio {
            margin-top: 20px;
            color: #d8e2ec;
            font-size: 19px;
            line-height: 1.6;
        }

        /* About */
        .about {
            margin-top: 35px;
            color: #9fb1c2;
            font-size: 15px;
            line-height: 1.7;
        }

        /* Buttons */
        .buttons {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .button {
            width: 85%;
            max-width: 350px;
            padding: 18px 25px;
            border: 2px solid #00bfff;
            border-radius: 18px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 10, 25, 0.55);
            box-shadow: 0 0 12px rgba(0, 191, 255, 0.25);
            transition: all 0.3s ease;
        }

        .button:hover {
            background: #00bfff;
            color: #00101c;
            box-shadow:
                0 0 15px #00bfff,
                0 0 35px rgba(0, 191, 255, 0.5);
            transform: translateY(-4px);
        }

        /* Footer */
        footer {
            margin-top: 55px;
            color: #667788;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .container {
                padding-top: 40px;
            }

            .tagline {
                font-size: 12px;
                letter-spacing: 5px;
            }

            .profile-box {
                width: 260px;
                height: 260px;
            }

            h1 {
                font-size: 30px;
                line-height: 1.3;
            }

            .username {
                font-size: 16px;
            }

            .bio {
                font-size: 17px;
            }

            .button {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- TOP TAGLINE -->
        <div class="tagline">
            EDITOR • PHOTOGRAPHY • CREATIVE
        </div>

        <!-- PROFILE PHOTO -->
        <div class="profile-box">
            <img
                class="profile"
                src="profile.jpg"
                alt="Jaswanth Kamaraj J">
        </div>

        <!-- NAME -->
        <h1>
            JASWANTH<br>
            KAMARAJ J
        </h1>

        <!-- USERNAME -->
        <div class="username">
            @jaswanth._.07_
        </div>

        <!-- BIO -->
        <p class="bio">
            EDITOR AND PHOTOGRAPHY 📸
        </p>

        <!-- ABOUT -->
        <p class="about">
            Capturing moments • Creating stories •
            Exploring creativity through photography and editing.
        </p>

        <!-- BUTTONS -->
        <div class="buttons">

            <a
                class="button"
                href="https://www.instagram.com/jaswanth._.07_/"
                target="_blank"
                rel="noopener noreferrer">
                📸 Instagram
            </a>

            <a
                class="button"
                href="https://github.com/jkhub"
                target="_blank"
                rel="noopener noreferrer">
                💻 GitHub
            </a>

            <a
                class="button"
                href="mailto:rockjaswanth.157@gmail.com">
                ✉️ Contact Me
            </a>

        </div>

        <!-- FOOTER -->
        <footer>
            © 2026 JK • JASWANTH KAMARAJ J
        </footer>

    </div>

</body>
</html>
